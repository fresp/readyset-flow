<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Readyset — grounded, reviewable, executable changes for omp" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .wordmark { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; fill: #f8fafc; }
      .tagline { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; fill: #94a3b8; }
      .chip-label { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; fill: #0f172a; }
      .chip-num { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; fill: #0f172a; opacity: 0.55; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text x="60" y="98" class="wordmark" font-size="56">Readyset</text>
  <text x="60" y="134" class="tagline" font-size="20">A standalone omp extension for grounded, reviewable, executable changes</text>
  <text x="60" y="162" class="tagline" font-size="16">/readyset · grill → explore → propose → review → execute · no other tool's files, no assumptions</text>

  <!-- workflow chips -->
  <g transform="translate(60, 205)">
    <!-- Grill -->
    <rect x="0" y="0" width="150" height="56" rx="10" fill="#e0f2fe"/>
    <text x="16" y="24" class="chip-num" font-size="13">01</text>
    <text x="16" y="44" class="chip-label" font-size="18">Grill</text>

    <path class="arrow" d="M158 28 L192 28" marker-end="url(#arrowhead)"/>

    <!-- Explore -->
    <rect x="200" y="0" width="170" height="56" rx="10" fill="#ede9fe"/>
    <text x="216" y="24" class="chip-num" font-size="13">02</text>
    <text x="216" y="44" class="chip-label" font-size="18">Explore</text>

    <path class="arrow" d="M378 28 L412 28" marker-end="url(#arrowhead)"/>

    <!-- Propose -->
    <rect x="420" y="0" width="170" height="56" rx="10" fill="#fae8ff"/>
    <text x="436" y="24" class="chip-num" font-size="13">03</text>
    <text x="436" y="44" class="chip-label" font-size="18">Propose</text>

    <path class="arrow" d="M598 28 L632 28" marker-end="url(#arrowhead)"/>

    <!-- Review -->
    <rect x="640" y="0" width="160" height="56" rx="10" fill="#fef9c3"/>
    <text x="656" y="24" class="chip-num" font-size="13">04</text>
    <text x="656" y="44" class="chip-label" font-size="18">Review</text>

    <path class="arrow" d="M808 28 L842 28" marker-end="url(#arrowhead)"/>

    <!-- Execute -->
    <rect x="850" y="0" width="170" height="56" rx="10" fill="#dcfce7"/>
    <text x="866" y="24" class="chip-num" font-size="13">05</text>
    <text x="866" y="44" class="chip-label" font-size="18">Execute</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
